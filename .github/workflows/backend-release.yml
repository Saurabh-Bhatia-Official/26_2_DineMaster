name: Backend Release

on:
  push:
    tags:
      - 'backend-v*'
  workflow_dispatch:
    inputs:
      version-tag:
        description: 'Release version tag (starting with v0.0.1, e.g. v0.0.1, backend-v0.0.1)'
        required: false
        default: 'backend-v0.0.1'

concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-version:
    name: Resolve Backend Release Version
    runs-on: ubuntu-latest
    outputs:
      version-name: ${{ steps.resolve.outputs.version-name }}
      tag-name: ${{ steps.resolve.outputs.tag-name }}
      release-title: ${{ steps.resolve.outputs.release-title }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: resolve
        shell: bash
        run: |
          REF_NAME="${{ github.ref_name }}"
          INPUT_TAG="${{ inputs.version-tag }}"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_TAG" ]]; then
            RAW="$INPUT_TAG"
          elif [[ "$REF_NAME" == backend-v* ]]; then
            RAW="${REF_NAME#backend-}"
          elif [[ "$REF_NAME" == v* ]]; then
            RAW="$REF_NAME"
          else
            RAW="v0.0.1"
          fi

          CLEAN_VER="${RAW#v}"
          CLEAN_VER="${CLEAN_VER:-0.0.1}"
          TAG_VER="backend-v${CLEAN_VER}"
          TITLE="Dine Master Backend v${CLEAN_VER}"

          echo "version-name=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "tag-name=${TAG_VER}" >> "$GITHUB_OUTPUT"
          echo "release-title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved backend version name: ${CLEAN_VER}, tag: ${TAG_VER}, title: ${TITLE}"

  build-backend:
    name: Build & Package Backend JAR
    needs: resolve-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run automated tests
        run: ./mvnw test

      - name: Package production JAR
        run: ./mvnw clean package -DskipTests

      - name: Prepare release JAR
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          JAR_FILE=$(ls target/*.jar | grep -v 'original-' | head -n 1)
          TARGET_NAME="dinemaster-backend-${{ needs.resolve-version.outputs.version-name }}.jar"
          cp "$JAR_FILE" "$GITHUB_WORKSPACE/release-artifacts/$TARGET_NAME"
          echo "Prepared $TARGET_NAME for release."

      - name: Upload backend release artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-jar
          path: release-artifacts/*
          retention-days: 14

  release:
    name: Create Backend GitHub Release
    needs: [resolve-version, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-release-jar
          path: release-artifacts

      - name: Inspect backend release artifact
        shell: bash
        run: |
          echo "=== Backend Release Artifact to be published ==="
          ls -lh release-artifacts/

      - name: Publish GitHub Release (Empty Description, No Release Notes)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag-name }}
          name: ${{ needs.resolve-version.outputs.release-title }}
          body: ""
          generate_release_notes: false
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
