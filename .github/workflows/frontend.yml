name: Frontend CI, Deployment & Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - 'vercel.json'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'
      - 'frontend-v*'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - 'vercel.json'
  workflow_dispatch:
    inputs:
      deploy_vercel:
        description: 'Deploy to Vercel Production'
        required: true
        type: boolean
        default: true
      create_release:
        description: 'Create Multi-Platform GitHub Release'
        required: true
        type: boolean
        default: true
      bump:
        description: 'Auto-increment release version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: 'patch'
      custom-version:
        description: 'Explicit custom version (used when bump is "custom", e.g. v0.0.1)'
        required: false
        default: ''

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # =====================================================================
  # 1. FRONTEND CI (Code Analysis & Unit/Widget Tests)
  # =====================================================================
  frontend-ci:
    name: Frontend Code Analysis & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare environment file
        shell: bash
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install dependencies (flutter pub get)
        run: flutter pub get

      - name: Analyze code (flutter analyze)
        run: flutter analyze
        continue-on-error: true

      - name: Run unit & widget tests
        run: flutter test
        continue-on-error: true

  # =====================================================================
  # 2. BUILD WEB APPLICATION
  # =====================================================================
  build-web:
    name: Build Web Application
    needs: frontend-ci
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-latest
      platform: web
      archive-name: dine-master
      version-name: 1.0.0
      build-number: ${{ github.run_number }}
    secrets: inherit

  # =====================================================================
  # 3. DEPLOY TO VERCEL (Production)
  # =====================================================================
  deploy-vercel:
    name: Deploy Frontend to Vercel (Production)
    needs: [frontend-ci, build-web]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || (github.event_name == 'workflow_dispatch' && inputs.deploy_vercel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: dine-master-web
          path: dist-web

      - name: Extract web build artifacts
        shell: bash
        run: |
          mkdir -p frontend/build/web
          if [ -f dist-web/dine-master-web.tar.gz ]; then
            tar -xzf dist-web/dine-master-web.tar.gz -C frontend/build/web
          elif [ -f dist-web/dine-master-web.zip ]; then
            unzip -q dist-web/dine-master-web.zip -d frontend/build/web
          fi
          cp vercel.json frontend/build/web/vercel.json 2>/dev/null || cp frontend/vercel.json frontend/build/web/vercel.json 2>/dev/null || true

      - name: Deploy to Vercel (Production)
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is not configured; skipping Vercel deployment."
            exit 0
          fi

          echo "Installing Vercel CLI..."
          npm install -g vercel@latest

          cd frontend/build/web
          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            mkdir -p .vercel
            printf '{\n  "orgId": "%s",\n  "projectId": "%s"\n}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          fi

          echo "Deploying production web build to Vercel..."
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          echo "Vercel production deployment completed successfully."

  # =====================================================================
  # 4. RESOLVE & AUTO-INCREMENT RELEASE VERSION
  # =====================================================================
  resolve-version:
    name: Resolve & Auto-Increment Release Version
    needs: frontend-ci
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/frontend-v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    outputs:
      version-name: ${{ steps.resolve.outputs.version-name }}
      tag-name: ${{ steps.resolve.outputs.tag-name }}
      release-title: ${{ steps.resolve.outputs.release-title }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and Auto-Increment Version
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ inputs.bump }}
          CUSTOM_VER: ${{ inputs.custom-version }}
        run: |
          python - << 'EOF'
          import os, re, subprocess

          event_name = os.getenv('EVENT_NAME', '')
          ref_name = os.getenv('REF_NAME', '')
          bump = os.getenv('BUMP', 'patch') or 'patch'
          custom_ver = (os.getenv('CUSTOM_VER') or '').strip()

          if event_name == 'push' and (ref_name.startswith('v') or ref_name.startswith('frontend-v')):
              raw = ref_name.replace('frontend-', '')
              clean = raw.lstrip('v')
              tag = f"v{clean}"
          elif custom_ver and (bump == 'custom' or not bump):
              clean = custom_ver.lstrip('v').strip()
              tag = f"v{clean}"
          else:
              subprocess.run(['git', 'fetch', '--tags', '--force'], check=False)
              res = subprocess.run(['git', 'tag', '-l', 'v*'], capture_output=True, text=True)
              tags = [t.strip() for t in res.stdout.strip().split('\n') if t.strip()]

              matching = []
              for t in tags:
                  if not t.startswith('v'):
                      continue
                  raw = t.replace('v', '')
                  parts = raw.split('.')
                  if len(parts) == 3 and all(p.isdigit() for p in parts):
                      matching.append(tuple(map(int, parts)))

              v0_matching = [m for m in matching if m[0] == 0]
              if v0_matching:
                  target_pool = v0_matching
              elif not any(m[0] == 0 for m in matching):
                  target_pool = []
              else:
                  target_pool = matching

              if not target_pool:
                  maj, min_, pat = 0, 0, 1
              else:
                  target_pool.sort()
                  maj, min_, pat = target_pool[-1]
                  if bump == 'major':
                      maj += 1
                      min_ = 0
                      pat = 0
                  elif bump == 'minor':
                      min_ += 1
                      pat = 0
                  else:
                      pat += 1

              clean = f"{maj}.{min_}.{pat}"
              tag = f"v{clean}"

          title = f"Dine Master {tag}"
          print(f"::notice::Auto-incremented Frontend Version: {tag} ({title})")

          gh_out = os.getenv('GITHUB_OUTPUT')
          if gh_out:
              with open(gh_out, 'a', encoding='utf-8') as f:
                  f.write(f"version-name={clean}\n")
                  f.write(f"tag-name={tag}\n")
                  f.write(f"release-title={title}\n")
          EOF

  # =====================================================================
  # 5. MULTI-PLATFORM BUILDS (Windows, macOS, Linux, Android, iOS)
  # =====================================================================
  build-windows:
    name: Build Windows (Desktop)
    needs: resolve-version
    uses: ./.github/workflows/build.yml
    with:
      runner: windows-latest
      platform: windows
      archive-name: dine-master
      version-name: ${{ needs.resolve-version.outputs.version-name }}
      build-number: ${{ github.run_number }}
    secrets: inherit

  build-macos:
    name: Build macOS (DMG & ZIP)
    needs: resolve-version
    uses: ./.github/workflows/build.yml
    with:
      runner: macos-latest
      platform: macos
      archive-name: dine-master
      version-name: ${{ needs.resolve-version.outputs.version-name }}
      build-number: ${{ github.run_number }}
    secrets: inherit

  build-linux:
    name: Build Linux (DEB, ZIP & AppImage)
    needs: resolve-version
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-latest
      platform: linux
      archive-name: dine-master
      version-name: ${{ needs.resolve-version.outputs.version-name }}
      build-number: ${{ github.run_number }}
    secrets: inherit

  build-android:
    name: Build Android (APK & AAB)
    needs: resolve-version
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-latest
      platform: android
      archive-name: dine-master
      version-name: ${{ needs.resolve-version.outputs.version-name }}
      build-number: ${{ github.run_number }}
    secrets: inherit

  build-ios:
    name: Build iOS (IPA)
    needs: resolve-version
    uses: ./.github/workflows/build.yml
    with:
      runner: macos-latest
      platform: ios
      archive-name: dine-master
      version-name: ${{ needs.resolve-version.outputs.version-name }}
      build-number: ${{ github.run_number }}
      upload-ios: false
    secrets: inherit

  # =====================================================================
  # 6. CREATE GITHUB RELEASE
  # =====================================================================
  release:
    name: Create GitHub Release
    needs:
      - resolve-version
      - build-web
      - build-windows
      - build-macos
      - build-linux
      - build-android
      - build-ios
    if: always() && needs.resolve-version.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Inspect release artifacts
        shell: bash
        run: |
          echo "=== Release Artifacts to be published ==="
          find release-artifacts -type f -exec ls -lh {} +

      - name: Publish GitHub Release (Empty Description, No Release Notes)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag-name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.resolve-version.outputs.release-title }}
          body: ""
          generate_release_notes: false
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for Public Release Repository Secrets
        id: check_public_secrets
        shell: bash
        env:
          PUBLIC_RELEASE_REPO: ${{ secrets.PUBLIC_RELEASE_REPO }}
          PUBLIC_REPO_PAT: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          if [ -n "$PUBLIC_RELEASE_REPO" ] && [ -n "$PUBLIC_REPO_PAT" ]; then
            echo "has_public_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_public_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Public Release Repository (Empty Description)
        if: steps.check_public_secrets.outputs.has_public_secrets == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ secrets.PUBLIC_RELEASE_REPO }}
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          tag_name: ${{ needs.resolve-version.outputs.tag-name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.resolve-version.outputs.release-title }}
          body: ""
          generate_release_notes: false
          files: release-artifacts/*
