name: Reusable Multi-Platform Build

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
        description: 'GitHub-hosted runner OS for this build (windows-latest, macos-latest, ubuntu-latest).'
      platform:
        required: true
        type: string
        description: 'Target platform: windows | linux | macos | ios | android | web'
      archive-name:
        required: true
        type: string
        description: 'Artifact name prefix (e.g. dine-master).'
      version-name:
        required: true
        type: string
        description: 'SemVer version (e.g. 0.0.1, 1.0.0).'
      build-number:
        required: true
        type: string
        description: 'Incrementing build number (e.g. 1, 2, ...).'
      upload-ios:
        required: false
        type: boolean
        default: false
        description: 'Upload the built iOS app to App Store Connect (TestFlight). Only set true when signing + App Store Connect secrets are configured.'
    secrets:
      ANDROID_CREDENTIALS:
        required: false
        description: 'Base64-encoded Google Play service account JSON (Android).'
      ANDROID_KEY_PROPERTIES:
        required: false
        description: 'Base64-encoded Android key.properties (release signing).'
      ANDROID_KEYSTORE:
        required: false
        description: 'Base64-encoded Android upload keystore (.jks).'
      MACOS_CERTIFICATE:
        required: false
        description: 'Base64-encoded Apple certificate (.p12) for macOS codesigning.'
      MACOS_CERTIFICATE_PWD:
        required: false
        description: 'Password for the macOS .p12 certificate.'
      MACOS_CERTIFICATE_NAME:
        required: false
        description: 'Name of the macOS import key (matching the certificate).'
      APPLE_CERTIFICATE_P12:
        required: false
        description: 'Base64-encoded Apple Distribution certificate (.p12) for iOS.'
      APPLE_CERTIFICATE_PASSWORD:
        required: false
        description: 'Password for the iOS .p12 certificate.'
      APPLE_CERTIFICATE_FILENAME:
        required: false
        description: 'Filename for the iOS .p12 certificate (e.g. dist.p12).'
      APPLE_PROVISIONING_PROFILE:
        required: false
        description: 'Base64-encoded Apple provisioning profile (.mobileprovision) for iOS.'
      APPLE_PROVISIONING_FILENAME:
        required: false
        description: 'Filename for the iOS provisioning profile.'
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
        description: 'App Store Connect API Key Issuer ID.'
      APP_STORE_CONNECT_KEY_ID:
        required: false
        description: 'App Store Connect API Key ID.'
      APP_STORE_CONNECT_KEY:
        required: false
        description: 'App Store Connect API private key (.p8) contents.'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (Android)
        if: ${{ inputs.platform == 'android' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        if: ${{ runner.os == 'Windows' }}
        run: flutter config --enable-windows-desktop

      - name: Enable Linux desktop
        if: ${{ runner.os == 'Linux' }}
        run: flutter config --enable-linux-desktop

      - name: Enable macOS desktop
        if: ${{ runner.os == 'macOS' }}
        run: flutter config --enable-macos-desktop

      - name: Prepare frontend environment
        shell: bash
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          mkdir -p "$GITHUB_WORKSPACE/build/dist"

      - name: Install dependencies (flutter pub get)
        run: flutter pub get

      # ============ PREPARE SIGNING (conditional by platform) ============
      - name: Set up Android signing
        if: ${{ inputs.platform == 'android' }}
        shell: bash
        env:
          CREDENTIALS: ${{ secrets.ANDROID_CREDENTIALS }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$CREDENTIALS" ]; then
            echo "::warning::Android signing secrets not configured; the APK will be signed with the debug keystore."
            exit 0
          fi
          mkdir -p "$HOME/.secrets"
          echo "$CREDENTIALS" | base64 --decode > "$HOME/.secrets/play-account.json"
          echo "$KEYSTORE" | base64 --decode > "$HOME/.secrets/upload-keystore.jks"
          echo "$KEY_PROPERTIES" | base64 --decode > android/key.properties
          sed -i 's|^\s*storeFile=.*|storeFile='"$HOME"'/.secrets/upload-keystore.jks|' android/key.properties

      - name: Set up iOS signing
        if: ${{ inputs.platform == 'ios' }}
        shell: bash
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PWD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CERT_FILENAME: ${{ secrets.APPLE_CERTIFICATE_FILENAME }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          PROFILE_FILENAME: ${{ secrets.APPLE_PROVISIONING_FILENAME }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::iOS signing secrets not configured; building unsigned."
            exit 0
          fi
          echo "$CERT_P12" | base64 --decode > /tmp/$CERT_FILENAME
          echo "$PROFILE" | base64 --decode > "/tmp/$PROFILE_FILENAME"
          KEYCHAIN="build.keychain"
          KEYCHAIN_PWD="$(openssl rand -base64 12)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "/tmp/$CERT_FILENAME" -k "$KEYCHAIN" -P "$CERT_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"
          security list-keychains -s "$KEYCHAIN"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "/tmp/$PROFILE_FILENAME" "$PROFILE_DIR/$PROFILE_FILENAME"

      - name: Set up macOS signing
        if: ${{ inputs.platform == 'macos' }}
        shell: bash
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          CERT_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: |
          if [ -z "$CERT" ]; then
            echo "::warning::macOS signing secrets not configured; building unsigned."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/macos_cert.p12"
          echo "$CERT" | base64 --decode > "$CERT_PATH"
          KEYCHAIN="build.keychain"
          KEYCHAIN_PWD="$(openssl rand -base64 12)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"
          security list-keychains -s "$KEYCHAIN"
          echo "MACOS_CERT_IDENTITY=$CERT_NAME" >> "$GITHUB_ENV"

      # ============ PLATFORM BUILDS ============
      - name: Run code analysis (Windows)
        if: ${{ inputs.platform == 'windows' }}
        shell: pwsh
        run: flutter analyze
        continue-on-error: true

      - name: Build Windows
        if: ${{ inputs.platform == 'windows' }}
        shell: pwsh
        run: |
          Write-Host "Building Windows release..."
          flutter build windows --release

          $distDir = Join-Path $env:GITHUB_WORKSPACE "build\dist"
          if (-not (Test-Path $distDir)) {
            New-Item -ItemType Directory -Path $distDir -Force | Out-Null
          }

          $releaseOutputDir = "$env:GITHUB_WORKSPACE\frontend\build\windows\x64\runner\Release"
          Write-Host "Verifying Windows release output at: $releaseOutputDir"
          Get-ChildItem -Path $releaseOutputDir

          # Package complete Windows application into a ZIP archive
          Write-Host "Packaging complete Windows application with runtime DLLs into ZIP archive..."
          Compress-Archive -Path "$releaseOutputDir\*" -DestinationPath "$distDir\${{ inputs.archive-name }}-windows-x64.zip" -Force

          # Inno Setup installer compilation (.exe)
          $issFile = "$env:GITHUB_WORKSPACE\frontend\windows\installer\dinemaster_setup.iss"
          if (Test-Path $issFile) {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $isccPath)) {
              Write-Host "Installing Inno Setup via chocolatey..."
              choco install innosetup -y --no-progress
            }
            if (Test-Path $isccPath) {
              Write-Host "Compiling Windows Setup Wizard installer (.exe)..."
              & $isccPath "/DMyAppVersion=${{ inputs.version-name }}" "/DMyAppSourceDir=$releaseOutputDir" "/O$distDir" "/F${{ inputs.archive-name }}-windows-setup" "$issFile"
            }
          }

      - name: Build Linux
        if: ${{ inputs.platform == 'linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev dpkg zip file
          flutter build linux --release

          DIST_DIR="$GITHUB_WORKSPACE/build/dist"
          mkdir -p "$DIST_DIR"
          BUNDLE_DIR="$GITHUB_WORKSPACE/frontend/build/linux/x64/release/bundle"

          echo "Packaging Linux application as ZIP & TAR.GZ..."
          cd "$BUNDLE_DIR"
          zip -r "$DIST_DIR/${{ inputs.archive-name }}-linux-x64.zip" .
          tar -czf "$DIST_DIR/${{ inputs.archive-name }}-linux-x64.tar.gz" .

          echo "Packaging Linux application as DEB package..."
          DEB_DIR="$RUNNER_TEMP/deb_build"
          rm -rf "$DEB_DIR"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/lib/dinemaster"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"

          {
            echo "Package: dinemaster"
            echo "Version: ${{ inputs.version-name }}"
            echo "Architecture: amd64"
            echo "Maintainer: DineMaster Team"
            echo "Description: DineMaster Restaurant POS and Management System"
          } > "$DEB_DIR/DEBIAN/control"

          cp -r "$BUNDLE_DIR/"* "$DEB_DIR/usr/lib/dinemaster/"

          {
            echo "#!/bin/sh"
            echo 'exec /usr/lib/dinemaster/dine_master "$@"'
          } > "$DEB_DIR/usr/bin/dinemaster"
          chmod +x "$DEB_DIR/usr/bin/dinemaster"

          {
            echo "[Desktop Entry]"
            echo "Name=DineMaster"
            echo "Comment=DineMaster Restaurant POS"
            echo "Exec=/usr/bin/dinemaster"
            echo "Icon=dinemaster"
            echo "Terminal=false"
            echo "Type=Application"
            echo "Categories=Office;Utility;"
          } > "$DEB_DIR/usr/share/applications/dinemaster.desktop"

          dpkg-deb --build "$DEB_DIR" "$DIST_DIR/${{ inputs.archive-name }}-linux-amd64.deb"

          echo "Packaging Linux application as AppImage..."
          APPDIR="$RUNNER_TEMP/DineMaster.AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r "$BUNDLE_DIR/"* "$APPDIR/usr/bin/"

          {
            echo "#!/bin/sh"
            echo 'HERE="$(dirname "$(readlink -f "$0")")"'
            echo 'export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${LD_LIBRARY_PATH}"'
            echo 'exec "${HERE}/usr/bin/dine_master" "$@"'
          } > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          {
            echo "[Desktop Entry]"
            echo "Name=DineMaster"
            echo "Exec=dine_master"
            echo "Icon=dinemaster"
            echo "Type=Application"
            echo "Categories=Office;Utility;"
          } > "$APPDIR/dinemaster.desktop"
          cp "$APPDIR/dinemaster.desktop" "$APPDIR/usr/share/applications/"

          if [ -f "$GITHUB_WORKSPACE/frontend/assets/icon.png" ]; then
            cp "$GITHUB_WORKSPACE/frontend/assets/icon.png" "$APPDIR/dinemaster.png"
            cp "$GITHUB_WORKSPACE/frontend/assets/icon.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/dinemaster.png"
          else
            touch "$APPDIR/dinemaster.png"
          fi

          cd "$RUNNER_TEMP"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool || true
          if [ -f appimagetool ]; then
            chmod +x appimagetool
            ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "$DIST_DIR/${{ inputs.archive-name }}-linux-x86_64.AppImage" || true
          fi
          if [ ! -f "$DIST_DIR/${{ inputs.archive-name }}-linux-x86_64.AppImage" ]; then
            echo "Packaging AppDir archive as AppImage fallback..."
            tar -czf "$DIST_DIR/${{ inputs.archive-name }}-linux-AppImage.tar.gz" DineMaster.AppDir
          fi

      - name: Build macOS
        if: ${{ inputs.platform == 'macos' }}
        shell: bash
        run: |
          flutter build macos --release
          cd build/macos/Build/Products/Release
          APP_BUNDLE="$(ls -d *.app | head -n 1)"
          DIST_DIR="$GITHUB_WORKSPACE/build/dist"
          mkdir -p "$DIST_DIR"

          echo "Packaging macOS application as ZIP archive..."
          ditto -c -k --keepParent "$APP_BUNDLE" "$DIST_DIR/${{ inputs.archive-name }}-macos.app.zip"

          echo "Packaging macOS application as DMG disk image..."
          hdiutil create -volname "DineMaster" -srcfolder "$APP_BUNDLE" -ov -format UDZO "$DIST_DIR/${{ inputs.archive-name }}-macos.dmg"

      - name: Build Android
        if: ${{ inputs.platform == 'android' }}
        shell: bash
        run: |
          flutter build apk --release --build-name ${{ inputs.version-name }} --build-number ${{ inputs.build-number }}
          flutter build appbundle --release --build-name ${{ inputs.version-name }} --build-number ${{ inputs.build-number }} || true
          DIST_DIR="$GITHUB_WORKSPACE/build/dist"
          mkdir -p "$DIST_DIR"
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "$DIST_DIR/${{ inputs.archive-name }}-release.apk"
          fi
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "$DIST_DIR/${{ inputs.archive-name }}-release.aab"
          fi

      - name: Build Web
        if: ${{ inputs.platform == 'web' }}
        shell: bash
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          TARGET_API_URL="${API_BASE_URL:-https://two6-2-dinemaster.onrender.com}"
          echo "Configuring Web production API_BASE_URL=$TARGET_API_URL"
          printf 'API_BASE_URL=%s\nAPP_ENV=production\n' "$TARGET_API_URL" > .env
          flutter build web --release
          cp vercel.json build/web/vercel.json 2>/dev/null || cp web/vercel.json build/web/vercel.json 2>/dev/null || true
          DIST_DIR="$GITHUB_WORKSPACE/build/dist"
          mkdir -p "$DIST_DIR"
          cd build/web
          tar -czf "$DIST_DIR/${{ inputs.archive-name }}-web.tar.gz" .
          zip -r "$DIST_DIR/${{ inputs.archive-name }}-web.zip" .

      - name: Build iOS (ipa)
        if: ${{ inputs.platform == 'ios' }}
        shell: bash
        run: |
          flutter build ios --release --no-codesign --build-name ${{ inputs.version-name }} --build-number ${{ inputs.build-number }}
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -r "$GITHUB_WORKSPACE/build/dist/${{ inputs.archive-name }}-ios.ipa" Payload

      - name: Upload iOS to App Store Connect (TestFlight)
        if: ${{ inputs.platform == 'ios' && inputs.upload-ios && success() }}
        shell: bash
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$API_KEY_ID" ] || [ -z "$ISSUER_ID" ]; then
            echo "::warning::App Store Connect secrets not configured; skipping TestFlight upload."
            exit 0
          fi
          echo "TestFlight upload requires codesigned build; skipped (unsigned archive)."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.archive-name }}-${{ inputs.platform }}
          path: build/dist/*
          if-no-files-found: ignore
          retention-days: 14
