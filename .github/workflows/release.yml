name: Release & Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  versions:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version-name: ${{ steps.resolve.outputs.version-name }}
      tag-name: ${{ steps.resolve.outputs.tag-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: resolve
        shell: bash
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [[ "$REF_NAME" == v* ]]; then
            RAW="$REF_NAME"
          else
            PUB_VER=$(grep '^version:' frontend/pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//; s/[[:space:]]//g')
            RAW="${PUB_VER:-1.0.0}"
          fi
          CLEAN_VER="${RAW#v}"
          TAG_VER="v${CLEAN_VER}"
          echo "version-name=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "tag-name=${TAG_VER}" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved version name: ${CLEAN_VER}, tag: ${TAG_VER}"

  build-apk:
    name: Build Android APK & AAB
    needs: versions
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-latest
      platform: android
      archive-name: dine-master
      version-name: ${{ needs.versions.outputs.version-name }}
      build-number: ${{ github.run_number }}
    secrets: inherit

  build-web:
    name: Build Web
    needs: versions
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-latest
      platform: web
      archive-name: dine-master
      version-name: ${{ needs.versions.outputs.version-name }}
      build-number: ${{ github.run_number }}

  build-windows:
    name: Build Windows
    needs: versions
    uses: ./.github/workflows/build.yml
    with:
      runner: windows-latest
      platform: windows
      archive-name: dine-master
      version-name: ${{ needs.versions.outputs.version-name }}
      build-number: ${{ github.run_number }}

  build-macos:
    name: Build macOS
    needs: versions
    uses: ./.github/workflows/build.yml
    with:
      runner: macos-latest
      platform: macos
      archive-name: dine-master
      version-name: ${{ needs.versions.outputs.version-name }}
      build-number: ${{ github.run_number }}
    secrets: inherit

  build-ios:
    name: Build iOS
    needs: versions
    uses: ./.github/workflows/build.yml
    with:
      runner: macos-latest
      platform: ios
      archive-name: dine-master
      version-name: ${{ needs.versions.outputs.version-name }}
      build-number: ${{ github.run_number }}
      upload-ios: true
    secrets: inherit

  # Linux desktop builds are best-effort: they commonly fail in GitHub CI
  # due to missing GTK/system libraries, so a failure here is reported but
  # does NOT block the GitHub Release.
  build-linux-nonfatal:
    name: Build Linux (best-effort)
    needs: versions
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-latest
      platform: linux
      archive-name: dine-master
      version-name: ${{ needs.versions.outputs.version-name }}
      build-number: ${{ github.run_number }}

  deploy-frontend-vercel:
    name: Deploy Frontend to Vercel
    needs: [versions, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: dine-master-web
          path: dist-web

      - name: Extract web build artifacts
        shell: bash
        run: |
          mkdir -p frontend/build/web
          tar -xzf dist-web/dine-master-web.tar.gz -C frontend/build/web
          cp frontend/vercel.json frontend/build/web/vercel.json 2>/dev/null || true

      - name: Deploy to Vercel (Production)
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is not configured; skipping Vercel deployment."
            exit 0
          fi
          echo "Installing Vercel CLI..."
          npm install -g vercel@latest

          cd frontend/build/web
          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            mkdir -p .vercel
            cat <<EOF > .vercel/project.json
          {
            "orgId": "$VERCEL_ORG_ID",
            "projectId": "$VERCEL_PROJECT_ID"
          }
          EOF
          fi

          echo "Deploying prebuilt web output to Vercel production..."
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          echo "Vercel production deployment completed."

  deploy-backend-render:
    name: Deploy Backend to Render
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render (Production)
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render backend deployment via Deploy Hook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "Render deploy hook triggered successfully (HTTP $HTTP_STATUS)."
            else
              echo "::warning::Render deploy hook returned status $HTTP_STATUS."
            fi
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "Triggering Render backend deployment via Render API..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "Render API deployment triggered successfully (HTTP $HTTP_STATUS)."
            else
              echo "::warning::Render API deployment returned status $HTTP_STATUS."
            fi
          else
            echo "::warning::Neither RENDER_DEPLOY_HOOK_URL nor (RENDER_API_KEY + RENDER_SERVICE_ID) configured; skipping Render deployment."
          fi

  release:
    name: Create GitHub Release
    needs:
      - versions
      - build-apk
      - build-web
      - build-windows
      - build-macos
      - build-ios
      - build-linux-nonfatal
      - deploy-frontend-vercel
      - deploy-backend-render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip duplicate run if release already has artifacts
        id: dupcheck
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.versions.outputs.tag-name }}
        run: |
          ASSET_COUNT="$(gh release view "$RELEASE_TAG" --json assets -q '.assets | length' 2>/dev/null || true)"
          if [ -n "$ASSET_COUNT" ] && [ "$ASSET_COUNT" -gt 0 ] 2>/dev/null; then
            echo "::notice::Release $RELEASE_TAG already has $ASSET_COUNT artifact(s); skipping duplicate build."
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release artifacts
        if: steps.dupcheck.outputs.skip_release != 'true'
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: false

      - name: Print artifact summary
        if: steps.dupcheck.outputs.skip_release != 'true'
        shell: bash
        run: |
          find release-artifacts -type f -printf '%p (%s bytes)\n'

      - name: Create Private GitHub Release
        if: steps.dupcheck.outputs.skip_release != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.versions.outputs.tag-name }}
          name: 'Dine Master ${{ needs.versions.outputs.tag-name }}'
          files: release-artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for Public Release Secrets
        id: check_public_secrets
        shell: bash
        env:
          PUBLIC_RELEASE_REPO: ${{ secrets.PUBLIC_RELEASE_REPO }}
          PUBLIC_REPO_PAT: ${{ secrets.PUBLIC_REPO_PAT }}
        run: |
          if [ -n "$PUBLIC_RELEASE_REPO" ] && [ -n "$PUBLIC_REPO_PAT" ]; then
            echo "has_public_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_public_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Public Release Repository
        if: steps.dupcheck.outputs.skip_release != 'true' && steps.check_public_secrets.outputs.has_public_secrets == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ secrets.PUBLIC_RELEASE_REPO }}
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          tag_name: ${{ needs.versions.outputs.tag-name }}
          name: 'Dine Master ${{ needs.versions.outputs.tag-name }}'
          files: release-artifacts/**/*
          generate_release_notes: true
