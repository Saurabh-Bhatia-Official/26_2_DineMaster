name: Backend CI & Render Deployment

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'render.yaml'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'render.yaml'
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-ci:
    name: Backend Test & Build (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend automated tests
        run: ./mvnw test

      - name: Package standalone executable JAR
        run: ./mvnw clean package -DskipTests

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dinemaster-backend-jar
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 14

  deploy-render:
    name: Deploy Backend to Render (Production)
    needs: backend-ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render backend deployment via Deploy Hook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "Render deploy hook triggered successfully (HTTP $HTTP_STATUS)."
            else
              echo "::error::Render deploy hook failed with HTTP status $HTTP_STATUS."
              exit 1
            fi
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "Triggering Render backend deployment via Render API..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "Render API deployment triggered successfully (HTTP $HTTP_STATUS)."
            else
              echo "::error::Render API deployment failed with HTTP status $HTTP_STATUS."
              exit 1
            fi
          else
            echo "::warning::Neither RENDER_DEPLOY_HOOK_URL nor (RENDER_API_KEY + RENDER_SERVICE_ID) configured; skipping Render deployment."
          fi
