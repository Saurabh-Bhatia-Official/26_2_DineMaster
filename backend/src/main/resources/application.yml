
server:
  port: ${PORT:${SERVER_PORT:8081}}

dinemaster:
  edge-authoritative-mode: ${EDGE_AUTHORITATIVE_MODE:false}
  edge-control-plane-enabled: ${EDGE_CONTROL_PLANE_ENABLED:false}
  edge-jwt-private-key-pem: ${EDGE_JWT_PRIVATE_KEY_PEM:}
  edge-jwt-public-key-pem: ${EDGE_JWT_PUBLIC_KEY_PEM:}
  sync-enabled: ${M28_SYNC_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8081,http://127.0.0.1:8080,https://26-2-dine-master.vercel.app,https://26-2-dine-master.vercel.app/,https://two6-2-dinemaster.onrender.com}
  guest:
    menu-base-url: ${GUEST_MENU_BASE_URL:https://26-2-dine-master.vercel.app/guest-menu}
    allowed-origin: ${GUEST_ALLOWED_ORIGIN:https://26-2-dine-master.vercel.app}

spring:
  config:
    import: optional:file:./backend/.env[.properties],optional:file:./.env[.properties]
  application:
    name: dinemaster-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dinemaster}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dinemaster-default-super-secure-jwt-secret-key-32-bytes-long!}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
    public-key-pem: ${JWT_PUBLIC_KEY_PEM:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

management:
  endpoints:
    enabled-by-default: false 
 
