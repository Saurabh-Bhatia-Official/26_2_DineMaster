services:
  - type: web
    name: dinemaster-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 10000
      - key: CORS_ALLOWED_ORIGINS
        value: https://26-2-dine-master.vercel.app,https://26-2-dine-master.vercel.app/
      - key: GUEST_ALLOWED_ORIGIN
        value: https://26-2-dine-master.vercel.app
      - key: GUEST_MENU_BASE_URL
        value: https://26-2-dine-master.vercel.app/guest-menu
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: dinemaster
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JPA_DDL_AUTO
        value: update
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
